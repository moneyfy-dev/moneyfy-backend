### PROPERTIES EXAMPLE ###
spring.application.name=segurosref

server.port=9000

# DATABASE CONFIGURATION
spring.data.mongodb.database=refseguros
spring.data.mongodb.port=27017
spring.data.mongodb.host=localhost

# SWAGGER CONFIGURATION
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Permitir subida de archivos y limitar tamaño (ej: perfil del usuario)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Seeders automaticos de arranque. En produccion deben quedar apagados.
moneyfy.seeders.auto-enabled=false

# Cleanup temporal de usuarios invalidos. Usar una vez y volver a false.
moneyfy.cleanup.invalid-users-enabled=false
